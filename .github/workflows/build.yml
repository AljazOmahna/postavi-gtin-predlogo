name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Debug — verify build.gradle and keystore dir
        run: |
          echo "=== app/build.gradle (signing section) ==="
          grep -A8 "signingConfigs" app/build.gradle || echo "(not found)"
          echo "=== keystore/ ==="
          ls -la keystore/ 2>/dev/null || echo "(empty or missing)"

      - name: Ensure stable keystore (generate once, commit permanently)
        run: |
          KS="keystore/kclj_debug.jks"
          mkdir -p keystore
          VALID=false
          if [ -f "$KS" ]; then
            if keytool -list -keystore "$KS" -storepass android -alias androiddebugkey -storetype JKS > /dev/null 2>&1; then
              VALID=true
              echo "Keystore OK (alias androiddebugkey found)"
            else
              echo "Keystore exists but alias missing — regenerating"
            fi
          else
            echo "Keystore file not found: $KS"
          fi
          if [ "$VALID" = "false" ]; then
            echo "Generating JKS keystore..."
            keytool -genkey -v \
              -keystore "$KS" \
              -storetype JKS \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -dname "CN=KCLJ Debug Key,O=KCLJ,C=SI"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$KS"
            git commit -m "ci: add stable JKS keystore [skip ci]"
            git push
            echo "Keystore generated and committed"
          fi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PostaviGtinPredlogo-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
