plugins {
    id 'com.android.application'
}

android {
    namespace 'si.kclj.gtinpredloga'
    compileSdk 34

    signingConfigs {
        kclj {
            storeFile file("../keystore/kclj_debug.jks")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
            storeType "JKS"
        }
    }

    defaultConfig {
        applicationId "si.kclj.gtinpredloga"
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName "1.0.7"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.kclj
        }
        debug {
            debuggable true
            signingConfig signingConfigs.kclj
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
