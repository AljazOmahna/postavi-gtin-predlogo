plugins {
    id 'com.android.application'
}

android {
    namespace 'si.kclj.gtinpredloga'
    compileSdk 34

    defaultConfig {
        applicationId "si.kclj.gtinpredloga"
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "1.0.4"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
